version: 2

sources:
  - name: arcline_raw
    description: >
      Raw Salesforce + HubSpot extracts, landed as seeds. In production these would be
      Fivetran/Airbyte tables in Snowflake; here they are deterministic CSV seeds so the
      project clones and runs with no warehouse account.
    schema: main
    loaded_at_field: _synced_at
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: raw_sf_accounts
      - name: raw_sf_users
      - name: raw_sf_opportunities
      - name: raw_sf_opportunity_stage_history
      - name: raw_sf_activities
      - name: raw_hs_contacts
      - name: raw_hs_marketing_events
      - name: raw_hs_lead_score_history
      # No _synced_at on these reference/history extracts -> no freshness check.
      - name: raw_hs_lifecycle_history
        loaded_at_field: null
        freshness: null
      - name: raw_ref_segment_map
        loaded_at_field: null
        freshness: null
      - name: raw_ref_id_crosswalk
        loaded_at_field: null
        freshness: null
