version: 2

models:
  - name: int_attribution__opp_touches
    description: "Net-new opp x preceding marketing touch, time-ranked."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [opp_id, event_id]
    columns:
      - name: touch_rank
        tests: [not_null]

  - name: fct_attribution
    description: "Multi-touch attribution of net-new pipeline to campaigns (first/last/linear)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [opp_id, attribution_model, campaign]
    columns:
      - name: attribution_model
        tests:
          - accepted_values:
              arguments:
                values: ['first_touch', 'last_touch', 'linear']
      - name: attributed_amount
        tests: [not_null]

  - name: rpt_attribution_by_campaign
    description: "Campaign x model rollup of attributed pipeline (segment 'All' blended)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [attribution_model, segment, campaign]
