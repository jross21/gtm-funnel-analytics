version: 2

models:
  - name: fct_metric_values
    description: "Long-format canonical metric values; the single source for KPI numbers."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [metric_name, grain, period_start, segment]
    columns:
      - name: metric_name
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: dim_metric_catalog
    description: "Governed metric catalog projection (mirrors metrics_catalog.yml)."
    columns:
      - name: metric_name
        tests: [unique, not_null]
      - name: kpi_dictionary_ref
        tests: [not_null]
